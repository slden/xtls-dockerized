version: "3.7"

services:
  caddy:
    container_name: caddy-server
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv
      - ./caddy_data:/data
      - ./caddy_config:/config

  xray:
      image: teddysun/xray:26.10.21
      user: root
    #   network_mode: host
      restart: always
      logging:
          driver: "json-file"
          options:
              max-size: "10M"
      volumes:
          # Mount the directory. VOLUME /etc/xray in the image hides a single-file bind of config.json.
          - ./xray:/etc/xray
          - ./caddy_data/caddy/certificates/acme-v02.api.letsencrypt.org-directory:/etc/certs
      environment:
          - xray.vmess.aead.forced=false
      container_name: xray
